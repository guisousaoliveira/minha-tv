name: Teste no emulador (servidor)

# Roda só quando chamado à mão: TV virtual faz o mesmo caminho do app contra o servidor informado
# (acha a série, pede os episódios e confere se aparecem Legendado e Dublado). Nada de servidor fica no código.
on:
  workflow_dispatch:
    inputs:
      server:
        description: Endereço do servidor Xtream
        required: true
      user:
        description: Usuário
        required: true
      pass:
        description: Senha (em branco usa o usuário)
        required: false
        default: ''
      series:
        description: Série
        required: false
        default: Ted Lasso
      movies:
        description: Filmes para conferir (separados por vírgula)
        required: false
        default: ''

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Liberar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compilar teste
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: TV virtual e teste
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SERVER: ${{ inputs.server }}
          XUSER: ${{ inputs.user }}
          XPASS: ${{ inputs.pass }}
          SERIES: ${{ inputs.series }}
          MOVIES: ${{ inputs.movies }}
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb logcat -c
            ./gradlew --no-daemon connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.server=$SERVER" "-Pandroid.testInstrumentationRunnerArguments.user=$XUSER" "-Pandroid.testInstrumentationRunnerArguments.pass=$XPASS" "-Pandroid.testInstrumentationRunnerArguments.series=$SERIES" "-Pandroid.testInstrumentationRunnerArguments.movies=$MOVIES" || echo "TESTE FALHOU"
            adb logcat -d -s MinhaTVTeste:I MinhaTV:I | tail -n 200
