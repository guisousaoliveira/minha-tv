name: Gerar APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes e build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Renomear APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk MinhaTV.apk
          cp mobile/build/outputs/apk/release/mobile-release.apk BadWolfTV-celular.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MinhaTV-apk
          path: MinhaTV.apk

      # o APK da TV vai sozinho e primeiro: TVs com o app antigo baixam o primeiro .apk do release
      - name: Publicar release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Minha TV 1.0.${{ github.run_number }}
          files: MinhaTV.apk
          make_latest: true

      - name: Juntar o APK do celular
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: BadWolfTV-celular.apk

  windows:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes e instalador do Windows
        shell: bash
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        run: |
          ./gradlew --no-daemon :desktop:test :desktop:packageExe
          cp "desktop/build/compose/binaries/main/exe/Bad Wolf TV-$APP_VERSION.exe" BadWolfTV-Windows.exe

      - name: Juntar o instalador ao release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: BadWolfTV-Windows.exe

  preview:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MinhaTV-apk

      - name: Liberar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: TV virtual e prints
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/preview.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previa-telas
          path: previews/

      - name: Guardar prints no branch "previa"
        if: always()
        run: |
          cd previews
          git init -q -b previa
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Prévia do build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" previa
